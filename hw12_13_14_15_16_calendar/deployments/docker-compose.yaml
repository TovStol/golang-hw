version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: calendar_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: idm_tests
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: calendar_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: calendar_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  migrations:
    image: postgres:16-alpine
    container_name: calendar_migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: idm_tests
    volumes:
      - ../build/run-migrations.sh:/run-migrations.sh
    command: sh /run-migrations.sh
    restart: "no"

  calendar:
    build:
      context: ..
      dockerfile: build/Dockerfile.calendar
    container_name: calendar_app
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    ports:
      - "8888:8888"
    environment:
      - Level=INFO
      - LogLocation=
      - DbDriverName=postgres
      - Dsn=host=postgres port=5432 user=postgres password=postgres dbname=idm_tests sslmode=disable
      - Host=0.0.0.0
      - Port=8888
      - Storage=postgres
    restart: unless-stopped

  scheduler:
    build:
      context: ..
      dockerfile: build/Dockerfile.scheduler
    container_name: calendar_scheduler
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      - Level=INFO
      - LogLocation=
      - DbDriverName=postgres
      - Dsn=host=postgres port=5432 user=postgres password=postgres dbname=idm_tests sslmode=disable
      - KafkaBrokers=kafka:9092
      - KafkaTopic=notifications
      - ScanInterval=10s
    restart: unless-stopped

  storer:
    build:
      context: ..
      dockerfile: build/Dockerfile.storer
    container_name: calendar_storer
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      - Level=INFO
      - LogLocation=
      - DbDriverName=postgres
      - Dsn=host=postgres port=5432 user=postgres password=postgres dbname=idm_tests sslmode=disable
      - KafkaBrokers=kafka:9092
      - KafkaTopic=notifications
      - KafkaGroupID=storer-group
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: calendar_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

volumes:
  postgres_data:
